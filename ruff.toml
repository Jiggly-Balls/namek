target-version = "py312"
line-length = 79

[lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "B904",
    "BLE001",
    "C401", "C408", "C901",
    "COM812",
    "CPY001",
    "D100", "D102", "D103", "D104", "D105", "D107", "D203", "D212", "D214", "D215", "D301",
    "DOC501", "DOC502",
    "D400", "D401", "D402", "D404", "D405", "D406", "D407", "D408", "D409", "D410", "D411", "D412", "D413", "D414", "D416", "D417",
    "E501", "E731",
    "EM101", "EM102",
    "G004",
    "PLE0604",
    "PLR",
    "PT009",
    "RET504",
    "RUF005", "RUF029",
    "S101", "S311", "S404",
    "SIM102", "SIM105", "SIM108",
    "TRY003",
]
fixable = [
    "D213",
    "F401", "F541", "F632",
    "I",
    "TRY201",
]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 72